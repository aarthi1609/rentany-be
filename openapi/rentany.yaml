openapi: 3.0.3
info:
  title: RentAny API
  version: 0.1.0
  description: OpenAPI-first contract for the RentAny MVP backend.
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:3000/api
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Service health and readiness checks.
  - name: Products
    description: Product listing discovery and management.
  - name: Rentals
    description: Rental request and lifecycle operations.
  - name: Messages
    description: Rental chat messages.
  - name: Notifications
    description: Email notification records.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List active product listings
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: city
          schema:
            type: string
      responses:
        '200':
          description: Product listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a rental product listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get product detail
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /rentals:
    get:
      tags: [Rentals]
      operationId: listRentals
      summary: List rental records
      parameters:
        - in: query
          name: ownerId
          schema:
            type: string
            format: uuid
        - in: query
          name: renterId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/RentalStatus'
      responses:
        '200':
          description: Rental records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rental'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rentals]
      operationId: createRental
      summary: Request a rental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentalRequest'
      responses:
        '201':
          description: Rental requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rentals/{id}/status:
    patch:
      tags: [Rentals]
      operationId: updateRentalStatus
      summary: Update rental status
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRentalStatusRequest'
      responses:
        '200':
          description: Rental status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
        '404':
          $ref: '#/components/responses/NotFound'

  /rentals/{id}/messages:
    get:
      tags: [Messages]
      operationId: listRentalMessages
      summary: List messages for a rental
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Rental messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Messages]
      operationId: createRentalMessage
      summary: Add a message to a rental
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRentalMessageRequest'
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notification records
      responses:
        '200':
          description: Notification records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPathParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: rentany-be

    ProductStatus:
      type: string
      enum: [active, paused, removed]

    RentalStatus:
      type: string
      enum: [requested, accepted, rejected, cancelled, in_progress, returned, completed]

    NotificationStatus:
      type: string
      enum: [pending, sent, failed]

    Product:
      type: object
      required: [id, ownerId, categoryId, title, pricePerDay, status]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          example: PlayStation 5
        description:
          type: string
        model:
          type: string
          example: PS5 Disc Edition
        imageS3Key:
          type: string
          example: products/ps5/main.jpg
        pricePerDay:
          type: number
          format: double
          example: 750
        city:
          type: string
          example: Chennai
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/ProductStatus'

    CreateProductRequest:
      type: object
      required: [ownerId, categoryId, title, pricePerDay]
      properties:
        ownerId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        model:
          type: string
        imageS3Key:
          type: string
        pricePerDay:
          type: number
          format: double
          minimum: 1
        city:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    Rental:
      type: object
      required: [id, productId, ownerId, renterId, startDate, endDate, totalPrice, status]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        renterId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalPrice:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/RentalStatus'
        pickupVideoS3Key:
          type: string
        returnVideoS3Key:
          type: string

    CreateRentalRequest:
      type: object
      required: [productId, ownerId, renterId, startDate, endDate, totalPrice]
      properties:
        productId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        renterId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalPrice:
          type: number
          format: double
          minimum: 0

    UpdateRentalStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RentalStatus'

    RentalMessage:
      type: object
      required: [id, rentalId, senderId, message, isSystemMessage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        rentalId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        message:
          type: string
        isSystemMessage:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateRentalMessageRequest:
      type: object
      required: [senderId, message]
      properties:
        senderId:
          type: string
          format: uuid
        message:
          type: string
        isSystemMessage:
          type: boolean
          default: false

    Notification:
      type: object
      required: [id, userId, type, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        rentalId:
          type: string
          format: uuid
        type:
          type: string
          example: rental_requested
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/NotificationStatus'
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
